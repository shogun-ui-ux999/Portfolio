<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- ============================================================
       THE BEDROOM — late-night scene, seen in lamp light.
       Built as SVG so it stays crisp at every viewport size and
       keeps a tiny payload. Coordinates match the 16:10 stage
       used by the hotspot overlay.
       ============================================================ -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a15"/>
      <stop offset="0.7" stop-color="#1c1410"/>
      <stop offset="1" stop-color="#150f0b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d14"/>
      <stop offset="1" stop-color="#191008"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.72" cy="0.16" r="0.55">
      <stop offset="0" stop-color="#f5c36b" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#e8a33d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ab6e8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b73b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ab6e8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8ab6e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c878"/>
      <stop offset="1" stop-color="#c9822a"/>
    </linearGradient>
    <linearGradient id="duvet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a382d"/>
      <stop offset="1" stop-color="#33251e"/>
    </linearGradient>
  </defs>

  <!-- Walls + floor -->
  <rect width="1600" height="700" fill="url(#wall)"/>
  <rect y="700" width="1600" height="300" fill="url(#floor)"/>
  <!-- Floorboards -->
  <g stroke="#0e0905" stroke-width="3" opacity="0.55">
    <line x1="0" y1="780" x2="1600" y2="760"/>
    <line x1="0" y1="860" x2="1600" y2="840"/>
    <line x1="0" y1="940" x2="1600" y2="925"/>
  </g>
  <!-- Skirting board -->
  <rect y="688" width="1600" height="14" fill="#0e0a07"/>

  <!-- Window with night sky (top-left) -->
  <g>
    <rect x="90" y="80" width="330" height="330" rx="10" fill="#0b111c"/>
    <rect x="90" y="80" width="330" height="330" rx="10" fill="url(#moonGlow)"/>
    <circle cx="360" cy="150" r="34" fill="#d8e4f4" opacity="0.9"/>
    <circle cx="348" cy="142" r="30" fill="#0b111c" opacity="0.35"/>
    <g fill="#cddcf0">
      <circle cx="140" cy="130" r="2" opacity="0.9"/>
      <circle cx="200" cy="200" r="1.6" opacity="0.7"/>
      <circle cx="260" cy="120" r="1.8" opacity="0.8"/>
      <circle cx="170" cy="300" r="1.5" opacity="0.6"/>
      <circle cx="330" cy="260" r="1.7" opacity="0.7"/>
      <circle cx="300" cy="340" r="1.4" opacity="0.5"/>
      <circle cx="130" cy="360" r="1.5" opacity="0.6"/>
    </g>
    <g stroke="#0e0a07" stroke-width="12">
      <line x1="255" y1="80" x2="255" y2="410"/>
      <line x1="90" y1="245" x2="420" y2="245"/>
    </g>
    <rect x="82" y="72" width="346" height="346" rx="12" fill="none" stroke="#3d2c1e" stroke-width="10"/>
    <!-- Curtain -->
    <path d="M430 60 q26 180 -6 360 l-34 0 q20 -180 4 -360 z" fill="#4a2e22"/>
    <path d="M448 60 q20 180 -4 360 l20 0 q22 -180 2 -360 z" fill="#3a241b"/>
  </g>

  <!-- Failed exams poster, wall (left of lamp) -->
  <g transform="rotate(-3 560 250)">
    <rect x="500" y="150" width="120" height="160" fill="#e7dac2" opacity="0.85"/>
    <g stroke="#b0522f" stroke-width="4" opacity="0.85">
      <line x1="512" y1="185" x2="608" y2="185"/>
      <line x1="512" y1="215" x2="608" y2="215"/>
      <line x1="512" y1="245" x2="608" y2="245"/>
      <line x1="512" y1="275" x2="600" y2="275"/>
    </g>
    <rect x="500" y="150" width="120" height="160" fill="none" stroke="#0e0a07" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- Desk (right, under lamp) -->
  <g>
    <rect x="880" y="560" width="600" height="26" rx="6" fill="#5a3d26"/>
    <rect x="880" y="560" width="600" height="26" rx="6" fill="none" stroke="#2a1c11" stroke-width="3"/>
    <rect x="905" y="586" width="26" height="180" fill="#43301e"/>
    <rect x="1428" y="586" width="26" height="180" fill="#43301e"/>
    <!-- Drawer unit -->
    <rect x="1200" y="586" width="250" height="170" rx="8" fill="#3a2818" stroke="#241708" stroke-width="4"/>
    <rect x="1225" y="610" width="200" height="52" rx="6" fill="#4a3420" stroke="#241708" stroke-width="3"/>
    <circle cx="1325" cy="636" r="7" fill="#c9a24e"/>
    <rect x="1225" y="682" width="200" height="52" rx="6" fill="#45301d" stroke="#241708" stroke-width="3"/>
    <circle cx="1325" cy="708" r="7" fill="#c9a24e"/>
  </g>

  <!-- Desk lamp (far right of desk) -->
  <g>
    <ellipse cx="1512" cy="300" rx="240" ry="200" fill="url(#lampGlow)"/>
    <rect x="1500" y="470" width="16" height="92" rx="6" fill="#1c2a3a"/>
    <path d="M1452 480 l56 -90 56 90 z" fill="url(#shade)"/>
    <ellipse cx="1508" cy="484" rx="52" ry="12" fill="#ffe9b0" opacity="0.95"/>
    <ellipse cx="1508" cy="560" rx="30" ry="8" fill="#0e0a07"/>
  </g>

  <!-- Laptop on desk with sticker-covered lid -->
  <g>
    <ellipse cx="1080" cy="585" rx="180" ry="60" fill="url(#screenGlow)" opacity="0.9"/>
    <path d="M985 560 L985 400 q0 -10 10 -10 L1180 390 q10 0 10 10 L1190 560 z" fill="#20242c" stroke="#0c0f14" stroke-width="4"/>
    <rect x="1000" y="410" width="175" height="135" rx="4" fill="#0d1622"/>
    <!-- code on screen -->
    <g font-family="monospace" font-size="13" fill="#8ab6e8" opacity="0.9">
      <text x="1012" y="432">&gt; train(model)</text>
      <text x="1012" y="452">&gt; epoch 12/12</text>
      <text x="1012" y="472" fill="#9fe8a8">acc: 0.94 ✓</text>
      <text x="1012" y="492" fill="#e8a33d">_</text>
    </g>
    <!-- stickers -->
    <circle cx="1030" cy="545" r="13" fill="#c05b3b"/>
    <rect x="1055" y="535" width="30" height="18" rx="4" fill="#d9b45b"/>
    <circle cx="1130" cy="543" r="11" fill="#8ab6e8"/>
    <rect x="1155" y="536" width="24" height="16" rx="4" fill="#7c6a4e"/>
    <rect x="995" y="560" width="200" height="14" rx="5" fill="#2c333e" stroke="#0c0f14" stroke-width="3"/>
  </g>

  <!-- Notebook on desk, left of laptop -->
  <g transform="rotate(-6 950 540)">
    <rect x="880" y="505" width="150" height="105" rx="6" fill="#e7dac2" stroke="#8a6f4a" stroke-width="4"/>
    <line x1="905" y1="505" x2="905" y2="610" stroke="#8a6f4a" stroke-width="6"/>
    <g stroke="#5a4a8a" stroke-width="2.5" fill="none" opacity="0.8">
      <circle cx="960" cy="545" r="20"/>
      <path d="M940 545 q20 -18 40 0"/>
      <line x1="928" y1="580" x2="985" y2="580"/>
      <line x1="928" y1="592" x2="970" y2="592"/>
    </g>
    <line x1="925" y1="560" x2="995" y2="548" stroke="#b0522f" stroke-width="3"/>
  </g>

  <!-- Sticky note on wall above notebook -->
  <g transform="rotate(4 990 330)">
    <rect x="950" y="300" width="80" height="76" fill="#e8c95a" opacity="0.92"/>
    <g stroke="#8a6f2a" stroke-width="2.5" opacity="0.8">
      <line x1="962" y1="320" x2="1018" y2="318"/>
      <line x1="962" y1="338" x2="1012" y2="336"/>
      <line x1="962" y1="356" x2="1020" y2="354"/>
    </g>
  </g>

  <!-- Certificate stack on shelf (right wall, above desk) -->
  <g>
    <rect x="600" y="120" width="220" height="16" rx="4" fill="#3d2c1e"/>
    <g transform="rotate(-4 680 108)">
      <rect x="620" y="84" width="130" height="26" rx="3" fill="#d4c2a5" stroke="#8a6f4a" stroke-width="2.5"/>
    </g>
    <g transform="rotate(3 720 100)">
      <rect x="650" y="62" width="130" height="26" rx="3" fill="#e7dac2" stroke="#8a6f4a" stroke-width="2.5"/>
    </g>
    <rect x="636" y="36" width="130" height="26" rx="3" fill="#cfc0a4" stroke="#8a6f4a" stroke-width="2.5"/>
    <circle cx="700" cy="49" r="8" fill="#c9a24e" opacity="0.9"/>
  </g>

  <!-- Calendar on wall (left, below window) -->
  <g transform="rotate(2 300 520)">
    <rect x="220" y="440" width="160" height="150" rx="6" fill="#e7dac2" stroke="#6a5136" stroke-width="5"/>
    <rect x="220" y="440" width="160" height="34" rx="6" fill="#b0522f"/>
    <g fill="#6a5136" opacity="0.75">
      <rect x="236" y="488" width="26" height="20" rx="2"/>
      <rect x="270" y="488" width="26" height="20" rx="2"/>
      <rect x="304" y="488" width="26" height="20" rx="2"/>
      <rect x="338" y="488" width="26" height="20" rx="2"/>
      <rect x="236" y="516" width="26" height="20" rx="2"/>
      <rect x="270" y="516" width="26" height="20" rx="2"/>
      <rect x="304" y="516" width="26" height="20" rx="2"/>
      <rect x="338" y="516" width="26" height="20" rx="2"/>
      <rect x="236" y="544" width="26" height="20" rx="2"/>
      <rect x="270" y="544" width="26" height="20" rx="2"/>
    </g>
    <circle cx="317" cy="526" r="21" fill="none" stroke="#b0522f" stroke-width="4"/>
    <path d="M225 600 q60 22 150 0 l0 14 q-90 20 -150 0 z" fill="#e8c95a" opacity="0.9" transform="rotate(-2 300 605)"/>
  </g>

  <!-- Bed with duvet (left foreground) -->
  <g>
    <rect x="40" y="760" width="480" height="170" rx="18" fill="url(#duvet)"/>
    <path d="M40 800 q120 26 240 8 t240 -6 l0 128 l-480 0 z" fill="#43301e" opacity="0.7"/>
    <rect x="20" y="742" width="120" height="60" rx="14" fill="#d4c2a5" opacity="0.85"/>
    <rect x="30" y="880" width="26" height="60" fill="#241708"/>
    <rect x="500" y="880" width="26" height="60" fill="#241708"/>
  </g>

  <!-- Smartphone on nightstand (center-left) -->
  <g>
    <rect x="590" y="770" width="120" height="90" rx="8" fill="#3a2818" stroke="#241708" stroke-width="4"/>
    <g transform="rotate(-12 650 795)">
      <rect x="622" y="752" width="56" height="98" rx="12" fill="#14181f" stroke="#05070a" stroke-width="4"/>
      <rect x="630" y="764" width="40" height="66" rx="4" fill="#1d3050"/>
      <path d="M632 766 l36 0 0 30 -36 0 z" fill="#3b73b8" opacity="0.5"/>
      <line x1="636" y1="806" x2="664" y2="806" stroke="#8ab6e8" stroke-width="3" opacity="0.8"/>
      <line x1="636" y1="816" x2="656" y2="816" stroke="#8ab6e8" stroke-width="3" opacity="0.5"/>
    </g>
    <!-- crack across screen -->
    <path d="M640 760 l14 18 -8 14 12 20" stroke="#dfe9f6" stroke-width="1.6" fill="none" opacity="0.75"/>
  </g>

  <!-- Chessboard on floor (center-right) -->
  <g transform="rotate(3 850 900)">
    <rect x="770" y="850" width="180" height="180" rx="6" fill="#241708" stroke="#120b04" stroke-width="5"/>
    <g>
      <rect x="782" y="862" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="801.5" y="862" width="19.5" height="19.5" fill="#3a2818"/><rect x="821" y="862" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="840.5" y="862" width="19.5" height="19.5" fill="#3a2818"/><rect x="860" y="862" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="879.5" y="862" width="19.5" height="19.5" fill="#3a2818"/><rect x="899" y="862" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="918.5" y="862" width="19.5" height="19.5" fill="#3a2818"/>
      <rect x="801.5" y="881.5" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="840.5" y="881.5" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="879.5" y="881.5" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="918.5" y="881.5" width="19.5" height="19.5" fill="#d4c2a5"/>
      <rect x="782" y="901" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="821" y="901" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="860" y="901" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="899" y="901" width="19.5" height="19.5" fill="#d4c2a5"/>
      <rect x="801.5" y="920.5" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="840.5" y="920.5" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="879.5" y="920.5" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="918.5" y="920.5" width="19.5" height="19.5" fill="#d4c2a5"/>
      <rect x="782" y="940" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="821" y="940" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="860" y="940" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="899" y="940" width="19.5" height="19.5" fill="#d4c2a5"/>
      <rect x="801.5" y="959.5" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="840.5" y="959.5" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="879.5" y="959.5" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="918.5" y="959.5" width="19.5" height="19.5" fill="#d4c2a5"/>
      <rect x="782" y="979" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="821" y="979" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="860" y="979" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="899" y="979" width="19.5" height="19.5" fill="#d4c2a5"/>
      <rect x="801.5" y="998.5" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="840.5" y="998.5" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="879.5" y="998.5" width="19.5" height="19.5" fill="#d4c2a5"/><rect x="918.5" y="998.5" width="19.5" height="19.5" fill="#d4c2a5"/>
    </g>
    <!-- fallen pieces -->
    <circle cx="830" cy="930" r="9" fill="#1a1208" stroke="#c9a24e" stroke-width="2"/>
    <circle cx="890" cy="970" r="9" fill="#d4c2a5" stroke="#6a5136" stroke-width="2"/>
  </g>

  <!-- Bracelet on desk edge -->
  <g transform="rotate(18 1245 548)">
    <ellipse cx="1245" cy="548" rx="34" ry="14" fill="none" stroke="#a8622f" stroke-width="7"/>
    <ellipse cx="1245" cy="548" rx="34" ry="14" fill="none" stroke="#c9822a" stroke-width="2" stroke-dasharray="6 5"/>
  </g>

  <!-- Mug beside laptop -->
  <g>
    <rect x="1210" y="520" width="34" height="40" rx="5" fill="#7c4a2a" stroke="#3a1f0e" stroke-width="3"/>
    <path d="M1244 528 q16 4 0 24" fill="none" stroke="#3a1f0e" stroke-width="4"/>
    <ellipse cx="1227" cy="522" rx="14" ry="4" fill="#2a1608"/>
    <path d="M1195 510 q6 -12 0 -18 M1207 512 q6 -12 0 -20" stroke="#d8cbb2" stroke-width="2.5" fill="none" opacity="0.4"/>
  </g>

  <!-- Book stack on floor near bed -->
  <g>
    <rect x="560" y="900" width="150" height="22" rx="4" fill="#5a2e2a"/>
    <rect x="575" y="878" width="130" height="22" rx="4" fill="#2e4a5a"/>
    <rect x="565" y="856" width="142" height="22" rx="4" fill="#5a5230"/>
  </g>

  <!-- Headphones on desk edge -->
  <g transform="rotate(-8 1380 540)">
    <path d="M1350 545 a30 30 0 0 1 60 0" fill="none" stroke="#14181f" stroke-width="8"/>
    <rect x="1342" y="538" width="14" height="22" rx="6" fill="#14181f"/>
    <rect x="1404" y="538" width="14" height="22" rx="6" fill="#14181f"/>
  </g>

  <!-- Ambient wash: warm center pool + vignette -->
  <rect width="1600" height="1000" fill="url(#lampGlow)" opacity="0.35"/>
  <rect width="1600" height="1000" fill="#0e0a07" opacity="0.12"/>
</svg>
