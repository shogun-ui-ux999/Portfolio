<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anchit's Museum — A Self-Guided Tour of Work, Failure, and Curiosity</title>
    <meta
      name="description"
      content="An interactive bedroom museum showcasing Anchit Aman's journey through AI, Biology, NEET, independent learning, failure, and relentless growth."
    />
    <meta name="author" content="Anchit Aman" />
    <meta name="theme-color" content="#06060e" />

    <!-- Open Graph -->
    <meta property="og:title" content="Anchit's Museum" />
    <meta
      property="og:description"
      content="A self-guided tour of my work, failures, curiosity, and the gap year that changed everything."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Anchit's Museum" />
    <meta
      name="twitter:description"
      content="A self-guided tour of my work, failures, curiosity, and the gap year that changed everything."
    />

    <!-- Favicon: a glowing cyan museum star -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2306060e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2300d4ff'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%2300d4ff' opacity='0.25'/%3E%3Ccircle cx='16' cy='16' r='14' fill='%2300d4ff' opacity='0.08'/%3E%3C/svg%3E"
    />

    <!-- Typography: editorial serif, clean sans, handwritten -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300..700&family=Caveat:wght@400..600&display=swap"
      rel="stylesheet"
    />

    <!-- Thematic loading state, removed when React mounts -->
    <style>
      #museum-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #06060e;
        color: #e8e4d8;
        font-family: Georgia, "Times New Roman", serif;
        letter-spacing: 0.08em;
        z-index: 9999;
      }
      #museum-boot .lamp {
        width: 10px;
        height: 10px;
        border-radius: 9999px;
        background: #00d4ff;
        box-shadow: 0 0 24px 8px rgba(0, 212, 255, 0.45);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #museum-boot p {
        font-size: 0.8rem;
        opacity: 0.7;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.5; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="museum-boot">
      <div class="lamp"></div>
      <p>Preparing the museum…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
